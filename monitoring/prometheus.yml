global:
  scrape_interval: 10s

# NOTE: these targets use Docker service names (catalog-service, order-service,
# etc.), not "localhost". This only works when Prometheus and the services
# are running together via `docker compose up` (Step 10). If you're running
# services individually from IntelliJ instead, use targets like
# host.docker.internal:8081 instead.
scrape_configs:
  - job_name: 'catalog-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['catalog-service:8081']

  - job_name: 'order-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['order-service:8082']

  - job_name: 'api-gateway'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['api-gateway:8080']

  - job_name: 'analytics-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['analytics-service:8083']

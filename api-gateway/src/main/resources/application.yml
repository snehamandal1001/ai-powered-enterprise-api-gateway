server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        # Any request starting with /api/products goes to catalog-service
        - id: catalog-service-route
          uri: http://localhost:8081
          predicates:
            - Path=/api/products/**

        # Any request starting with /api/orders goes to order-service
        - id: order-service-route
          uri: http://localhost:8082
          predicates:
            - Path=/api/orders/**

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,gateway
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.aigateway.gateway: INFO
    org.springframework.cloud.gateway: INFO

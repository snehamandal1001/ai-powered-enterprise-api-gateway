server:
  port: 8080

spring:
  application:
    name: api-gateway
  data:
    redis:
      host: localhost
      port: 6380
  cloud:
    gateway:
      routes:
        # Any request starting with /api/products goes to catalog-service
        - id: catalog-service-route
          uri: http://${CATALOG_SERVICE_HOST:localhost}:8081
          predicates:
            - Path=/api/products/**
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 5   # tokens added per second
                redis-rate-limiter.burstCapacity: 10  # max tokens a client can save up
                key-resolver: "#{@clientIpKeyResolver}"

        # Any request starting with /api/orders goes to order-service
        - id: order-service-route
          uri: http://${ORDER_SERVICE_HOST:localhost}:8082
          predicates:
            - Path=/api/orders/**
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 5
                redis-rate-limiter.burstCapacity: 10
                key-resolver: "#{@clientIpKeyResolver}"

# Used to sign and verify JWT tokens.
# This one is fine for learning/local use. If this ever becomes a
# real public project, generate a new one and load it from an
# environment variable instead of committing it to Git.
jwt:
  secret: e1UcqvfDzCtbO76rwrMdR0drStNi6Vg0OAvXZzsfebk=
  expiration-ms: 3600000  # 1 hour

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,gateway
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.aigateway.gateway: INFO
    org.springframework.cloud.gateway: INFO

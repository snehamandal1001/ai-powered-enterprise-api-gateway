server:
  port: 8083

spring:
  application:
    name: analytics-service
  datasource:
    url: jdbc:postgresql://localhost:5435/analytics_db
    username: analytics_user
    password: analytics_pass
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

# The AI query endpoint needs a real Anthropic API key to work.
# We read it from an environment variable so it's never committed
# to Git by accident. Get a key at https://console.anthropic.com
anthropic:
  api-key: ${ANTHROPIC_API_KEY:}
  model: claude-haiku-4-5-20251001

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
